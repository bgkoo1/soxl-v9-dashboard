name: V11 strategy regression
on:
  push:
    branches: [main]
    paths:
      - "SOXL_V11_backtest.py"
      - "SOXL_V10_backtest.py"
      - "SOXL_V9_backtest.py"
      - "tests/**"
      - ".github/workflows/v11-regression.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  v11-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pandas numpy
      - run: python -m unittest discover -s tests -p "test_v11*.py" -v
      - run: python -m py_compile SOXL_dashboard.py SOXL_V11_backtest.py
