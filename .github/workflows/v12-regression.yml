name: Standalone V12 validation
on:
  push:
    branches: [main, 'rebuild/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q v12 streamlit_app.py
      - run: python -m unittest discover -s tests -p 'test_rebuild*.py' -v
      - run: python -m unittest discover -s tests -p 'test_v12_manual_holdings.py' -v
      - run: python -m unittest discover -s tests -p 'test_v12_trade_management.py' -v
