name: V12 six-slot readonly regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/v12-six-slot-readonly-20261028]
  workflow_dispatch:
jobs:
  validate-v12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile SOXL_V12_backtest.py SOXL_V12_dashboard.py v12_manual_holdings.py SOXL_dashboard.py
      - run: python -m unittest discover -s tests -p "test_v12_regression.py" -v
      - run: python -m unittest discover -s tests -p "test_v12_manual_holdings.py" -v
      - run: python -m unittest discover -s tests -p "test_v11*.py" -v
